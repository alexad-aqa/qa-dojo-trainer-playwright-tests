name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - qa

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    # Uses the selected dropdown value, or defaults to 'dev' on push/PR
    environment: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true
          BASE_URL: ${{ secrets.BASE_URL }}
          TEST_USER: ${{ secrets.TEST_USER }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

      - name: Upload HTML report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ github.event.inputs.environment || 'dev' }}
          path: playwright-report/
          retention-days: 30

      - name: Upload JSON report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: json-report-${{ github.event.inputs.environment || 'dev' }}
          path: playwright-report-json/
          retention-days: 30

      - name: Upload report for GitHub Pages
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: playwright-report/

      # - name: Upload blob report
      #   uses: actions/upload-artifact@v7
      #   if: ${{ !cancelled() }}
      #   with:
      #     name: blob-report-${{ github.event.inputs.environment || 'dev' }}
      #     path: blob-report/
      #     retention-days: 7

  # NEW: publish the report to GitHub Pages
  deploy-report:
    needs: test
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
